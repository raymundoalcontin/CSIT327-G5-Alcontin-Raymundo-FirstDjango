
{% extends "base.html" %}

{% block content %}

<div style="max-width: 700px; margin: 40px auto; padding: 25px; font-family: Arial, sans-serif;">

    <h1 style="color: #222; margin-bottom: 20px;">My Profile</h1>

    {% if messages %}
        {% for message in messages %}
            <p style="color: green; background-color: #e8f5e9; padding: 12px; border-radius: 6px;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <div style="background-color: #f5f7fa; padding: 25px; border-radius: 10px;">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                style="background-color: #2563eb; color: white; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;">
                Update Profile
            </button>

            <a href="{% url 'dashboard' %}"
                style="display: inline-block; background-color: #6b7280; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; margin-left: 5px;">
                Back to Home
            </a>

        </form>

    </div>

</div>

{% endblock %}
